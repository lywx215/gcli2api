name: gcli2api-ci

on:
  push:
    branches: [dev7]
  pull_request:
    branches: [dev7, master, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest
      - run: python scripts/export_management_openapi.py --check
      - run: python scripts/scan_sensitive_literals.py
