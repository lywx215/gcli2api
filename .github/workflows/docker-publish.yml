name: Docker Build and Publish

on:
  workflow_run:
    workflows: ["Update Version File"]
    types:
      - completed
    branches:
      - master
      - main
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
      - dev8
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # 只在 workflow_run 成功时运行，或者非 workflow_run 触发时运行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_run 触发时需要获取最新的代码（包括 version.txt 的更新）
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}

      - name: Resolve source version metadata
        id: source-version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_BRANCH: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          SOURCE_REF="$REF_NAME"
          SOURCE_REF_TYPE="$REF_TYPE"
          if [[ "$EVENT_NAME" == "workflow_run" && -n "$WORKFLOW_BRANCH" ]]; then
            SOURCE_REF="$WORKFLOW_BRANCH"
            SOURCE_REF_TYPE="branch"
          elif [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BRANCH" ]]; then
            SOURCE_REF="$PR_BRANCH"
            SOURCE_REF_TYPE="branch"
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "source_ref_type=$SOURCE_REF_TYPE" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ github.sha }}
            SOURCE_REF=${{ steps.source-version.outputs.source_ref }}
            SOURCE_REF_TYPE=${{ steps.source-version.outputs.source_ref_type }}
            SOURCE_COMMIT_DATE=${{ steps.source-version.outputs.commit_date }}
